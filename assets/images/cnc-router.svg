<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cnc-router" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="grid_cnc-router" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>
      <circle cx="32" cy="32" r="1" fill="#FFFFFF" opacity="0.15" />
    </pattern>
    <filter id="shadow_cnc-router" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bg_cnc-router)" />
  <rect width="800" height="500" rx="12" fill="url(#grid_cnc-router)" />

  <!-- Technical Circular Radar / Blueprint Accent -->
  <circle cx="400" cy="220" r="140" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.2" />
  <circle cx="400" cy="220" r="90" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />

  <!-- Center Card / Device Frame -->
  <g filter="url(#shadow_cnc-router)">
    <rect x="150" y="70" width="500" height="300" rx="14" fill="#FFFFFF" />
    <rect x="150" y="70" width="500" height="36" rx="14" fill="#F8FAFC" />
    <circle cx="178" cy="88" r="4.5" fill="#EF4444" />
    <circle cx="194" cy="88" r="4.5" fill="#F59E0B" />
    <circle cx="210" cy="88" r="4.5" fill="#10B981" />
    <rect x="235" y="81" width="300" height="14" rx="7" fill="#E2E8F0" opacity="0.7" />
  </g>

  <!-- Graphic Blueprint Inside Frame -->
  <g transform="translate(180, 125)">
    <rect x="0" y="0" width="440" height="220" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <!-- Grid inside -->
    <line x1="20" y1="180" x2="420" y2="180" stroke="#CBD5E1" stroke-width="1" />
    <line x1="20" y1="40" x2="20" y2="180" stroke="#CBD5E1" stroke-width="1" />
    
    <!-- 3D/CAD Isometric wireframe lines -->
    <path d="M 70 150 L 180 70 L 340 70 L 370 150 Z" fill="none" stroke="#38BDF8" stroke-width="2.5" />
    <path d="M 70 150 L 70 170 L 370 170 L 370 150" fill="none" stroke="#38BDF8" stroke-width="2.5" />
    <line x1="180" y1="70" x2="180" y2="170" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Center Mechanism Accent -->
    <circle cx="240" cy="120" r="22" fill="none" stroke="#F59E0B" stroke-width="2.5" />
    <line x1="240" y1="90" x2="240" y2="150" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="210" y1="120" x2="270" y2="120" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Badges inside screen -->
    <rect x="30" y="20" width="90" height="18" rx="4" fill="#38BDF8" opacity="0.2" />
    <text x="75" y="33" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="bold" fill="#38BDF8">ENGINEERING</text>
  </g>

  <!-- Title & Subtitle Badge Bottom -->
  <g transform="translate(400, 430)" text-anchor="middle">
    <rect x="-190" y="-24" width="380" height="42" rx="21" fill="#0F172A" />
    <text y="-2" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="1">CNC ROUTER 3-AXIS</text>
    <text y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="10" fill="#94A3B8">CAD / CAM &amp; GRBL INTEGRATION</text>
  </g>
</svg>

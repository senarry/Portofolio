<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- Google Fonts: Maven Pro (Headings/Display), Open Sans & PT Sans (Body), JetBrains Mono (Code/Metadata) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Maven+Pro:wght@500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>

  <!-- Backdrop untuk mobile menu -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <!-- Mobile Header Bar (< 860px) -->
  <header class="mobile-header">
    <div class="mobile-logo-name">Husain Afrizal</div>
    <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

  </header>

  <!-- Master App Container -->
  <div class="app-container">
    
    <!-- ========================================== -->
    <!-- SIDEBAR KIRI (15-20% WIDTH STICKY)        -->

    <aside id="sidebar" class="sidebar">

      <div class="sidebar-header">

      <!-- Menu Navigasi Vertikal -->
      <nav class="sidebar-nav">

        </ul>
      </nav>

      <!-- Sidebar Footer / Quick Links -->
      <div class="sidebar-footer">
        <a href="#kontak" class="sidebar-cta-btn">
          <span>Hubungi Saya</span>
          <span>→</span>
        </a>
        <div class="sidebar-socials">
          <a href="https://www.linkedin.com/in/husainafrizal/" target="_blank" class="social-icon-btn" title="LinkedIn" aria-label="LinkedIn">

          </a>
        </div>
      </div>
    </aside>

    <!-- ========================================== -->
    <main class="main-content">

      <!-- 1. LATAR BELAKANG -->
      <section id="latar-belakang" class="portfolio-section">
        <div class="section-container-box">
          <div class="category-box-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>PROFIL SINGKAT</span>
          </div>
          <div id="hero-content">
            <!-- Render dinamis -->
          </div>
        </div>
      </section>

      <!-- 2. PENDIDIKAN -->
      <section id="pendidikan" class="portfolio-section">
        <div class="section-container-box">
          <div class="category-box-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path></svg>
            <span>PENDIDIKAN</span>
          </div>
          <div id="education-content">
            <!-- Render dinamis -->
          </div>
        </div>
      </section>

      <!-- 3. PROJECT PERKULIAHAN (2 KOLOM KANAN KIRI) -->

          <div id="stupen-content" class="experience-container">
            <!-- Render dinamis -->

        </div>

      <!-- 6. SERTIFIKAT -->
      <section id="sertifikat" class="portfolio-section">
        <div class="section-container-box">
          <div class="category-box-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>

          <div id="certificates-grid" class="certificates-container">
            <!-- Render dinamis -->
          </div>
        </div>
      </section>

      <!-- 7. KONTAK -->
      <section id="kontak" class="portfolio-section">
        <div class="section-container-box">
          <div class="category-box-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>

  <div id="project-modal" class="modal-overlay" aria-hidden="true">

      <div class="modal-header">
        <div class="modal-header-meta">
          <span id="modal-category-badge" class="modal-category-badge">DETAIL PROYEK</span>
        </div>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Tutup Popup">&times;</button>
      </div>

      <div id="modal-body-content" class="modal-body">
        <!-- Konten detail proyek / pengalaman di-inject via modal.js -->
      </div>

      <div id="modal-footer-content" class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Tutup</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/data.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/scrollspy.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
